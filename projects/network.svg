<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Arial, Helvetica, sans-serif">
  <!-- Sfondo -->
  <rect x="0" y="0" width="900" height="540" rx="12" fill="#ffffff"/>

  <!-- Titolo -->
  <text x="30" y="32" font-size="15" font-weight="bold" fill="#111827">Rete principale 192.168.178.0/24</text>

  <!-- Collegamenti Router A -> Router B (WAN 1 GbE) -->
  <path d="M360 75 H150 V200" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="255" y="66" text-anchor="middle" font-size="12" fill="#374151">1 GbE (WAN)</text>

  <!-- Collegamento Router A -> Switch (2.5 GbE) -->
  <line x1="450" y1="100" x2="450" y2="200" stroke="#374151" stroke-width="3"/>
  <text x="462" y="155" font-size="12" fill="#374151">2.5 GbE</text>

  <!-- Collegamento Router A -> Wi-Fi -->
  <line x1="540" y1="75" x2="640" y2="75" stroke="#374151" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Router A -->
  <rect x="360" y="50" width="180" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Router A</text>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#1f2937">192.168.178.1</text>

  <!-- Wi-Fi -->
  <rect x="640" y="50" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="740" y="72" text-anchor="middle" font-size="15" fill="#111827">Wi-Fi</text>
  <text x="740" y="90" text-anchor="middle" font-size="12" fill="#1f2937">192.168.178.0/24</text>

  <!-- Router B -->
  <rect x="60" y="200" width="180" height="50" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="150" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Router B</text>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#1f2937">LAN 192.168.179.x</text>

  <!-- Switch gestito -->
  <rect x="360" y="200" width="180" height="50" rx="8" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/>
  <text x="450" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Switch gestito</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#1f2937">8 porte 2.5 GbE</text>

  <!-- Gruppo rete 192.168.179.0/24 -->
  <rect x="30" y="300" width="240" height="220" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="510" font-size="12" font-weight="bold" fill="#374151">Rete 192.168.179.0/24</text>

  <!-- Dorsale rete .179 -->
  <line x1="150" y1="250" x2="150" y2="440" stroke="#374151" stroke-width="2"/>
  <line x1="135" y1="380" x2="150" y2="380" stroke="#374151" stroke-width="2"/>
  <line x1="150" y1="380" x2="165" y2="380" stroke="#374151" stroke-width="2"/>
  <line x1="135" y1="440" x2="150" y2="440" stroke="#374151" stroke-width="2"/>
  <line x1="150" y1="440" x2="165" y2="440" stroke="#374151" stroke-width="2"/>

  <!-- Dispositivi rete .179 -->
  <rect x="45" y="360" width="90" height="40" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="90" y="385" text-anchor="middle" font-size="13" fill="#111827">Parrot VM</text>
  <rect x="165" y="360" width="90" height="40" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="210" y="385" text-anchor="middle" font-size="13" fill="#111827">Telefono</text>
  <rect x="45" y="420" width="90" height="40" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="90" y="445" text-anchor="middle" font-size="13" fill="#111827">TV</text>
  <rect x="165" y="420" width="90" height="40" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="210" y="445" text-anchor="middle" font-size="13" fill="#111827">Stampante</text>

  <!-- Dorsale switch -->
  <line x1="450" y1="250" x2="450" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="360" y1="330" x2="840" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="360" y1="330" x2="360" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="480" y1="330" x2="480" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="600" y1="330" x2="600" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="720" y1="330" x2="720" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="840" y1="330" x2="840" y2="400" stroke="#374151" stroke-width="2"/>

  <!-- Dispositivi sullo switch -->
  <rect x="310" y="400" width="100" height="44" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="360" y="427" text-anchor="middle" font-size="13" fill="#111827">Mac</text>
  <rect x="430" y="400" width="100" height="44" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="480" y="427" text-anchor="middle" font-size="13" fill="#111827">MSI laptop</text>
  <rect x="550" y="400" width="100" height="44" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="600" y="427" text-anchor="middle" font-size="13" fill="#111827">PC fisso</text>
  <rect x="670" y="400" width="100" height="44" rx="6" fill="#fef3c7" stroke="#92400e"/>
  <text x="720" y="422" text-anchor="middle" font-size="13" fill="#111827">Homelab</text>
  <text x="720" y="437" text-anchor="middle" font-size="11" fill="#1f2937">Proxmox</text>
  <rect x="790" y="400" width="100" height="44" rx="6" fill="#f3f4f6" stroke="#374151"/>
  <text x="840" y="427" text-anchor="middle" font-size="13" fill="#111827">Raspberry Pi</text>
</svg>